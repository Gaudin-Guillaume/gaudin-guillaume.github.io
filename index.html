<html lang="fr">

<title>Guillaume Gaudin — Product Designer</title>
<meta name="description" content="Portfolio de Guillaume Gaudin, Product Designer. Ses projets sont rangés dans un dossier à ouvrir.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='7' width='22' height='20' rx='5' fill='%23efebe4' stroke='%23b8b2a4'/%3E%3Ccircle cx='21' cy='13' r='2.5' fill='%238fb3a0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=Caveat:wght@500..700&display=swap">
<style>
/* Glace et perle : fond beige clair, surfaces de verre dépoli, couleur en petites touches. */
:root {
  --bg: #efebe4;
  --orb-1: rgba(190, 210, 228, .75);
  --orb-2: rgba(238, 208, 188, .65);
  --veil: rgba(239, 235, 228, .62);
  --ink: #2b2a27;
  --ink-2: #77736a;
  --line: rgba(60, 50, 30, .12);
  --accent: #5f82ad;
  --live: #2fa56b;

  --glass-a: rgba(255, 255, 255, .74);
  --glass-b: rgba(255, 255, 255, .32);
  --glass-edge: rgba(255, 255, 255, .95);
  --face-a: #fffefc;
  --face-b: #efebe2;
  --surf: #fdfcfa;
  --pill-on: #ffffff;
  --sheen: linear-gradient(115deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 45%);
  --shadow: 0 40px 70px -38px rgba(70, 58, 36, .42), 0 14px 26px -18px rgba(70, 58, 36, .22);

  --paper: #fdfcf9;
  --p-ink: #2b2a27;
  --p-ink-2: #77736a;
  --p-line: rgba(60, 50, 30, .1);
  --p-accent: #4f729d;

  --tab-1: #8fb3a0;
  --tab-2: #7f9bd0;
  --tab-3: #e0a98f;
  --tab-4: #d8c27a;
  --tab-5: #a99ad0;

  --font-display: "Outfit", "Futura", "Avenir Next", "Century Gothic", sans-serif;
  --font-mono: "Outfit", "Futura", "Avenir Next", "Century Gothic", sans-serif;

  --fw: min(430px, calc(100vw - 48px));
  --fh: calc(var(--fw) * 1.3);
  --tabh: 28px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --orb-1: rgba(70, 96, 128, .45); --orb-2: rgba(130, 90, 66, .32); --veil: rgba(18, 20, 23, .66);
    --ink: #ecebe6; --ink-2: #9a978f; --line: rgba(255, 255, 255, .14); --accent: #9db8dc; --live: #5fd39a;
    --glass-a: rgba(255, 255, 255, .11); --glass-b: rgba(255, 255, 255, .04); --glass-edge: rgba(255, 255, 255, .2);
    --face-a: #2d3137; --face-b: #22252a; --surf: #2d3138; --pill-on: rgba(255, 255, 255, .14);
    --sheen: linear-gradient(115deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 45%);
    --shadow: 0 40px 70px -38px rgba(0, 0, 0, .85), 0 14px 26px -18px rgba(0, 0, 0, .6);
    --paper: #23262b; --p-ink: #ecebe6; --p-ink-2: #9a978f; --p-line: rgba(255, 255, 255, .1); --p-accent: #9db8dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --orb-1: rgba(70, 96, 128, .45); --orb-2: rgba(130, 90, 66, .32); --veil: rgba(18, 20, 23, .66);
  --ink: #ecebe6; --ink-2: #9a978f; --line: rgba(255, 255, 255, .14); --accent: #9db8dc; --live: #5fd39a;
  --glass-a: rgba(255, 255, 255, .11); --glass-b: rgba(255, 255, 255, .04); --glass-edge: rgba(255, 255, 255, .2);
  --face-a: #2d3137; --face-b: #22252a; --surf: #2d3138; --pill-on: rgba(255, 255, 255, .14);
  --sheen: linear-gradient(115deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 45%);
  --shadow: 0 40px 70px -38px rgba(0, 0, 0, .85), 0 14px 26px -18px rgba(0, 0, 0, .6);
  --paper: #23262b; --p-ink: #ecebe6; --p-ink-2: #9a978f; --p-line: rgba(255, 255, 255, .1); --p-accent: #9db8dc;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(55% 45% at 12% 8%, var(--orb-1), transparent 70%),
    radial-gradient(50% 45% at 92% 88%, var(--orb-2), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 400 15px/1.5 var(--font-display);
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
img { max-width: 100%; }
.mono { font-family: var(--font-mono); letter-spacing: .15em; text-transform: uppercase; font-size: 11px; font-weight: 500; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.swatches { display: inline-flex; gap: 6px; align-items: center; }
.swatches i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

/* ---------- En-tête ---------- */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center; width: 100%; max-width: 1100px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; line-height: 1.2; text-decoration: none; }
.brand b { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.brand span { color: var(--ink-2); font-size: 13px; }
.nav { display: flex; align-items: center; gap: 4px; }
.nav a { text-decoration: none; padding: 8px 16px; border-radius: 999px; font-weight: 500; font-size: 14px; color: var(--ink-2); transition: background .25s, color .25s; }
.nav a:hover { color: var(--ink); background: var(--glass-a); }
.nav a.pill { color: var(--ink); background: linear-gradient(150deg, var(--glass-a), var(--glass-b)); box-shadow: inset 0 0 0 1px var(--glass-edge), 0 8px 20px -14px rgba(70, 58, 36, .35); }
.hint { text-align: center; color: var(--ink-2); margin: 16px 0 0; font-size: 14px; min-height: 1.5em; }
.stage { position: relative; display: grid; place-items: center; padding: calc(var(--tabh) + 16px) 0 10px; overflow-x: clip; }

/* Pastille « disponible » */
.live-wrap { display: flex; justify-content: center; margin-top: 24px; }
.live {
  display: inline-flex; align-items: center; gap: 10px; margin: 0; padding: 8px 16px 8px 14px; border-radius: 999px;
  font-size: 14px; font-weight: 500;
  background: linear-gradient(150deg, var(--glass-a), var(--glass-b));
  box-shadow: inset 0 0 0 1px var(--glass-edge), 0 10px 24px -16px rgba(70, 58, 36, .4);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.live-dot { position: relative; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 10px color-mix(in srgb, var(--live) 70%, transparent); }
.live-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--live); animation: ping 2.2s cubic-bezier(0, 0, .2, 1) infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .55; } 75%, 100% { transform: scale(3.2); opacity: 0; } }

/* Pied de page */
.foot { width: 100%; max-width: 1100px; margin: auto auto 0; padding-top: 36px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; color: var(--ink-2); }
.foot-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.btn-in, .theme {
  color: var(--ink); border: 0; cursor: pointer; text-decoration: none;
  background: linear-gradient(150deg, var(--glass-a), var(--glass-b));
  box-shadow: inset 0 0 0 1px var(--glass-edge), 0 8px 20px -14px rgba(70, 58, 36, .4);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: transform .2s;
}
.btn-in:hover, .theme:hover { transform: translateY(-2px); }
.btn-in { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.btn-in svg { width: 16px; height: 16px; fill: currentColor; }
.theme { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme .sun { display: none; }
.theme.is-dark .sun { display: block; }
.theme.is-dark .moon { display: none; }

/* ---------- Éléments communs ---------- */
.tabx {
  position: absolute; top: calc(-1 * var(--tabh)); height: calc(var(--tabh) + 1px); width: 128px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 12px 12px 0 0; color: var(--ink-2);
  background: linear-gradient(180deg, var(--face-a), var(--face-b));
  box-shadow: inset 0 0 0 1px var(--glass-edge), 0 -6px 14px -10px rgba(70, 58, 36, .3);
  clip-path: inset(-20px -20px 0 -20px);
}
.art { border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; flex: none; background: #e9e5db; }
.art svg, .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
.eyebrow { margin: 0; color: var(--p-ink-2); }
.desc { margin: 0; font-size: 14px; line-height: 1.55; color: var(--p-ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; border: 1px solid var(--p-line); padding: 3px 9px; border-radius: 999px; color: var(--p-ink-2); }
.more { align-self: flex-start; border: 0; background: none; padding: 2px 0; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--p-accent); border-bottom: 1px solid currentColor; }
.more:hover { opacity: .7; }

/* ---------- Le dossier (vraie 3D : épaisseur, tranches, charnière) ---------- */
.scene {
  --T: 44px; /* altitude du milieu de la couverture */
  --H: 42px; /* épaisseur du paquet de feuilles */
  position: relative; width: var(--fw); height: var(--fh);
  perspective: 1800px; perspective-origin: 50% 40%;
  transition: transform .95s cubic-bezier(.5, .1, .2, 1), perspective-origin .95s cubic-bezier(.5, .1, .2, 1);
}
.scene.open { transform: translateX(calc(var(--fw) / 2)); perspective-origin: 0 40%; }
.rig {
  position: absolute; inset: 0; transform-style: preserve-3d;
  transform: rotateX(11deg) rotateY(-22deg); transform-origin: 50% 50% 0;
  transition: transform-origin .95s cubic-bezier(.5, .1, .2, 1);
}
.scene.open .rig { transform-origin: 0 50% 0; }
.rig > *, .deck > *, .hingepos > .cover { position: absolute; }

.floor { position: absolute; left: -4%; width: 108%; bottom: -34px; height: 46px; background: radial-gradient(closest-side, rgba(24, 18, 8, .5), transparent); filter: blur(9px); transition: left .95s cubic-bezier(.5, .1, .2, 1), width .95s cubic-bezier(.5, .1, .2, 1); pointer-events: none; }
.scene.open .floor { left: -104%; width: 208%; }

/* Fond du dossier */
.board {
  inset: 0; border-radius: 6px 18px 18px 6px;
  background: linear-gradient(150deg, var(--face-b), color-mix(in srgb, var(--face-b) 86%, #000));
  box-shadow: inset 0 0 0 1px var(--glass-edge);
}
.board::after, .outside::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 26px; border-radius: inherit; background: linear-gradient(90deg, rgba(70, 58, 36, .1), transparent); pointer-events: none; }
.board .tabx { right: 30px; }

/* Tranches du paquet de feuilles */
.side { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.s-right { left: calc(100% - var(--H) / 2); top: 18px; width: var(--H); height: calc(100% - 36px); transform: translateZ(calc(var(--H) / 2)) rotateY(90deg); background: repeating-linear-gradient(90deg, var(--paper) 0 2px, color-mix(in srgb, var(--p-ink) 24%, var(--paper)) 2px 3px); }
.s-bottom { left: 6px; width: calc(100% - 24px); top: calc(100% - var(--H) / 2); height: var(--H); transform: translateZ(calc(var(--H) / 2)) rotateX(-90deg); background: repeating-linear-gradient(180deg, var(--paper) 0 2px, color-mix(in srgb, var(--p-ink) 28%, var(--paper)) 2px 3px); }
.s-top { left: 6px; width: calc(100% - 24px); top: calc(0px - var(--H) / 2); height: var(--H); transform: translateZ(calc(var(--H) / 2)) rotateX(90deg); background: repeating-linear-gradient(180deg, var(--paper) 0 2px, color-mix(in srgb, var(--p-ink) 20%, var(--paper)) 2px 3px); }
.s-spine { left: calc(0px - var(--H) / 2); top: 6px; width: var(--H); height: calc(100% - 12px); transform: translateZ(calc(var(--H) / 2)) rotateY(-90deg); background: linear-gradient(90deg, color-mix(in srgb, var(--face-b) 78%, #000), var(--face-b)); }

/* Feuilles : chacune à sa propre altitude */
.deck { inset: 0; transform-style: preserve-3d; }
.scene:not(.open) .deck { visibility: hidden; transition: visibility 0s .9s; }
.scene.open .deck { visibility: visible; }
.pocket { left: 30px; right: 24px; top: 26px; bottom: 76px; transform-style: preserve-3d; touch-action: pan-y; }
.sheet {
  position: absolute; inset: 0; background: var(--paper); color: var(--p-ink);
  border-radius: 16px; padding: 14px;
  box-shadow: inset 0 0 0 1px var(--p-line), 0 14px 26px -16px rgba(70, 58, 36, .4);
  display: flex; flex-direction: column; gap: 14px;
  transition: transform .55s cubic-bezier(.3, .7, .2, 1), opacity .4s;
  cursor: pointer; overflow: hidden;
}
.sheet[data-pos="0"] { transform: translate3d(0, 0, 30px); }
.sheet[data-pos="1"] { transform: translate3d(6px, 6px, 20px) rotate(1deg); }
.sheet[data-pos="2"] { transform: translate3d(-4px, 11px, 12px) rotate(-1.2deg); }
.sheet[data-pos="far"] { opacity: 0; transform: translate3d(0, 12px, 4px); pointer-events: none; }
.sheet[data-pos="past"] { opacity: 0; transform: translate3d(-125%, -4%, 24px) rotate(-12deg); pointer-events: none; }
.s-body { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.sheet h3 { margin: 0; font-size: 24px; line-height: 1.12; letter-spacing: -.02em; font-weight: 600; text-wrap: balance; }

.pager { left: 30px; right: 24px; bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; transform: translateZ(10px); }
.circ { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surf); color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 16px; box-shadow: inset 0 0 0 1px var(--glass-edge), 0 6px 14px -8px rgba(70, 58, 36, .45); transition: transform .2s; }
.circ:hover { transform: scale(1.07); }
.circ.pill { width: auto; padding: 0 16px 0 14px; gap: 6px; border-radius: 999px; font-size: 14px; font-weight: 600; grid-auto-flow: column; }
.circ[disabled] { opacity: .28; pointer-events: none; box-shadow: none; }
.dots { display: flex; gap: 8px; align-items: center; }
.dot { position: relative; width: 6px; height: 6px; padding: 0; border: 0; border-radius: 999px; background: var(--ink-2); opacity: .35; cursor: pointer; transition: width .3s, background .3s, opacity .3s; }
.dot::after { content: ""; position: absolute; inset: -9px -5px; }
.dot[aria-current="true"] { width: 22px; background: var(--accent); opacity: 1; }


/* Cartes projet : toute la feuille est cliquable, le bouton dit clairement quoi faire */
.sheet .art { aspect-ratio: 2 / 1; }
.sheet .art svg, .sheet .art img { transition: transform .7s cubic-bezier(.3, .7, .2, 1); }
.sheet:hover .art svg, .sheet:hover .art img { transform: scale(1.05); }
.s-body { flex: 1; }
.s-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.s-count { color: var(--p-ink-2); }
.sheet h3 { font-size: 22px; }
.sheet .desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cta {
  margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 14px;
  padding: 5px 5px 5px 18px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px;
  background: var(--p-ink); color: var(--paper); transition: background .25s, box-shadow .25s;
}
.cta::after { content: ""; position: absolute; inset: 0; border-radius: 16px; } /* rend toute la feuille cliquable */
.cta-ic { width: 32px; height: 32px; border-radius: 50%; background: var(--paper); color: var(--p-ink); display: grid; place-items: center; font-size: 16px; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); }
.sheet:hover .cta { background: var(--p-accent); }
.sheet:hover .cta-ic { transform: translateX(3px); }
.sheet[data-pos="0"]:hover { transform: translate3d(0, -3px, 36px); box-shadow: inset 0 0 0 1px var(--p-line), 0 22px 32px -16px rgba(70, 58, 36, .5); }
.sheet:has(.cta:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
.cta:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--accent); }

/* Couverture : charnière sur la tranche gauche, épaisseur de 4 px */
.hingepos { inset: 0; transform-style: preserve-3d; transform: translateZ(calc(var(--T) / 2)); pointer-events: none; }
.cover { inset: 0; transform-style: preserve-3d; transform-origin: 0 50% 0; transition: transform 1s cubic-bezier(.55, .05, .2, 1); pointer-events: none; }
.cmid { position: absolute; inset: 0; transform-style: preserve-3d; transform: translateZ(calc(var(--T) / 2)); pointer-events: none; }
.scene:not(.open) .cover:hover { transform: rotateY(-15deg); }
.scene.open .cover { transform: rotateY(-180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; pointer-events: auto;
  background: linear-gradient(150deg, var(--face-a), var(--face-b));
  box-shadow: inset 0 0 0 1px var(--glass-edge);
}
.face::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--sheen); pointer-events: none; }
.outside { border-radius: 6px 18px 18px 6px; transform: translateZ(2px); }
.scene:not(.open) .outside { cursor: pointer; }
.outside .tabx { right: 30px; }
.inside { border-radius: 18px 6px 6px 18px; transform: rotateY(180deg) translateZ(2px); }
.inside::after { content: ""; position: absolute; inset: 0 0 0 auto; width: 26px; border-radius: inherit; background: linear-gradient(270deg, rgba(70, 58, 36, .1), transparent); pointer-events: none; }
.inside .tabx { left: 30px; }
.cedge { position: absolute; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: color-mix(in srgb, var(--face-b) 82%, #000); }
.ce-r { top: 18px; bottom: 18px; right: -2px; width: 4px; transform: rotateY(90deg); }
.ce-t { left: 6px; right: 18px; top: -2px; height: 4px; transform: rotateX(90deg); }
.ce-b { left: 6px; right: 18px; bottom: -2px; height: 4px; transform: rotateX(-90deg); }

/* Post-it : mots écrits à la main sur la couverture */
.pi {
  --pw: calc(var(--fw) * .33);
  position: absolute; margin: 0; box-sizing: border-box; width: var(--pw); aspect-ratio: 1; padding: calc(var(--pw) * .17) calc(var(--pw) * .09) calc(var(--pw) * .08);
  display: grid; place-items: center; text-align: center; pointer-events: none;
  font: 600 calc(var(--fw) * .05)/1.02 "Caveat", "Bradley Hand", "Segoe Print", cursive; color: #2c3b57; text-wrap: balance;
  background: linear-gradient(172deg, var(--pi-a), var(--pi-b));
  box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 12px 14px -9px rgba(60, 45, 20, .5), 0 2px 3px rgba(60, 45, 20, .18);
  border-radius: 2px 2px 14px 2px; transform: rotate(var(--r)); transform-origin: 50% 0;
  animation: pi-stick .7s cubic-bezier(.3, 1.3, .5, 1) both var(--d, .5s);
}
.pi::before { content: ""; position: absolute; inset: 0 0 auto; height: 15%; background: linear-gradient(180deg, rgba(255, 255, 255, .5), transparent); }
.pi::after { content: ""; position: absolute; right: 0; bottom: 0; width: 22%; height: 22%; background: linear-gradient(315deg, rgba(60, 45, 20, .16) 50%, transparent 50%); border-radius: 0 0 14px 0; }
.pi-1 { --pi-a: #fff0a0; --pi-b: #ffe272; --r: -4deg; left: 8%; top: 18%; }
.pi-2 { --pi-a: #ffd3cc; --pi-b: #ffbcb0; --r: 3.5deg; --d: .65s; left: 47%; top: 30%; }
@media (max-width: 600px) { .pi-1 { top: 13%; } .pi-2 { top: 24%; } }
@keyframes pi-stick { from { opacity: 0; transform: translateY(-14px) scale(1.18) rotate(calc(var(--r) - 6deg)); } to { opacity: 1; transform: rotate(var(--r)); } }

/* Trombone : pincé sur la tranche droite de la couverture (boucles avant/arrière + coudes autour de l'épaisseur) */
.clip { --wire: #a6aeb9; position: absolute; right: 0; top: 24%; width: 0; height: 28px; transform-style: preserve-3d; pointer-events: none; }
.clip svg { position: absolute; top: 0; overflow: visible; fill: none; stroke-linecap: round; }
.clip .m { stroke: var(--wire); stroke-width: 2.6; }

.clip .clip-br { left: -.4px; width: 6px; height: 9.2px; margin-top: -4.6px; transform: rotateX(90deg); }

.cv { position: absolute; inset: 34px 32px 30px 44px; display: flex; flex-direction: column; justify-content: space-between; }
.cv-top { display: flex; justify-content: flex-end; align-items: center; color: var(--ink-2); min-height: 8px; }

.open-btn { border: 0; cursor: pointer; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; padding: 11px 20px; border-radius: 999px; transition: transform .2s; }

.note { position: absolute; left: 32px; right: 44px; top: 34px; bottom: 84px; color: var(--ink); }

.note h3 { margin: 10px 0 12px; font-size: 28px; line-height: 1.08; letter-spacing: -.025em; font-weight: 500; }
.note dl { margin: 20px 0 0; display: grid; gap: 10px; }
.note dl div { display: grid; grid-template-columns: 92px 1fr; gap: 8px; border-top: 1px solid var(--line); padding-top: 9px; }
.note dt { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: var(--ink-2); padding-top: 2px; }

@media (max-width: 939px) {

  .scene.open { transform: none; perspective-origin: 0 40%; }
  .scene.open .floor { left: -4%; width: 108%; }
  .scene.open .cover { visibility: hidden; transition: transform 1s cubic-bezier(.55, .05, .2, 1), visibility 0s .95s; }
}

/* ---------- Autocollants (photo) ---------- */
.sticker { --sw: 140px; position: relative; width: var(--sw); aspect-ratio: 4 / 5; flex: none; transform: rotate(-4deg); transition: transform .45s cubic-bezier(.3, .7, .2, 1); filter: drop-shadow(0 1px 0 rgba(40, 30, 15, .1)) drop-shadow(0 12px 14px rgba(40, 30, 15, .28)); }
.sticker:hover { transform: rotate(-1deg) scale(1.03); }
.sticker-w { position: absolute; inset: 0; }
.sticker-in {
  position: absolute; inset: 0; padding: 6px; background: #fff;
  border-radius: calc(var(--sw) / 2) calc(var(--sw) / 2) 18px 18px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%);
}
.sticker-in img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; border-radius: calc(var(--sw) / 2 - 6px) calc(var(--sw) / 2 - 6px) 12px 12px; }
.sticker-in::after { content: ""; position: absolute; inset: 6px; border-radius: calc(var(--sw) / 2 - 6px) calc(var(--sw) / 2 - 6px) 12px 12px; background: linear-gradient(115deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 38%); pointer-events: none; }
.peel-w { position: absolute; right: 0; bottom: 0; width: 30px; height: 30px; filter: drop-shadow(-2px -2px 3px rgba(40, 30, 15, .28)); }
.peel { display: block; width: 100%; height: 100%; clip-path: polygon(0 0, 100% 0, 0 100%); background: linear-gradient(135deg, #ffffff, #d8d3c7); }
.spark { position: absolute; top: -12px; right: -14px; width: 36px; height: 36px; transform: rotate(14deg); overflow: visible; }
.spark path { fill: #e0a98f; stroke: #fff; stroke-width: 5; stroke-linejoin: round; paint-order: stroke; }
.about-top { display: flex; align-items: flex-start; gap: 22px; margin: 4px 0 20px 8px; }
.about-top h3 { margin: 8px 0 0; font-size: 26px; }
.about-hero { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: clamp(26px, 5vw, 52px); margin-bottom: 28px; padding: 14px 18px 0 22px; }
.about-hero .sticker { --sw: clamp(150px, 22vw, 210px); }
.about-hero .pj-head { margin: 0; }
@media (max-width: 600px) { .about-hero { grid-template-columns: 1fr; justify-items: start; } }

/* ---------- Autocollants d'outils (on les décolle d'un clic) ---------- */
@property --cut { syntax: "<length>"; inherits: false; initial-value: 0px; }
.tools { margin: 14px 0 12px; }
.tools-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 22px; color: var(--ink-2); }
.tools-row { display: flex; flex-wrap: wrap; gap: 12px 14px; padding: 12px 6px 4px; min-height: 76px; }
.tool {
  --tw: 54px; --cut: 0px; position: relative; flex: none; width: var(--tw); height: var(--tw); padding: 0; border: 0; background: none; display: block; cursor: default;
  transform: rotate(var(--r)); transition: transform .3s cubic-bezier(.3, 1.4, .5, 1), --cut .25s, opacity .4s;
  filter: drop-shadow(0 1px 0 rgba(40, 30, 15, .1)) drop-shadow(0 6px 8px rgba(40, 30, 15, .25));
}
.tool-in { position: absolute; inset: 0; padding: 7px; background: #fff; border-radius: 16px; display: grid; place-items: center; clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%); }
.tool-in svg { display: block; width: 100%; height: 100%; }
@keyframes slap { from { transform: rotate(var(--r)) scale(1.7); opacity: 0; } to { transform: rotate(var(--r)) scale(1); opacity: 1; } }
.scene.open .note .tool, .ov.show .tool { animation: slap .45s cubic-bezier(.3, 1.4, .5, 1) backwards; animation-delay: calc(var(--i) * .07s + .75s); }
.ov.show .tool { animation-delay: calc(var(--i) * .07s + .25s); }
.about-tools { margin: 4px 0 24px; }
.about-tools .tool { --tw: 64px; }
.ov .tools-head { color: var(--p-ink-2); }

/* Les éléments 3D de la page ne doivent jamais passer devant le calque (certains navigateurs mobiles les affichent au-dessus). */
body.ov-open #top, body.ov-open #main, body.ov-open #footer { visibility: hidden; transition: visibility 0s .4s; }

/* ---------- Page projet / À propos (calque) ---------- */
.ov {
  position: fixed; inset: 0; z-index: 100; overflow-y: auto; overscroll-behavior: contain;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--veil); backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2);
  opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s;
}
.ov.show { opacity: 1; visibility: visible; transition: opacity .4s; }
.ov-card {
  position: relative; width: min(920px, 100%); margin: 40px auto 0; background: var(--paper); color: var(--p-ink);
  border-radius: 28px; padding: clamp(20px, 4.5vw, 44px);

.ov.show .ov-card { transform: none; }
.ov-close { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 110; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surf); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; box-shadow: inset 0 0 0 1px var(--glass-edge), 0 8px 18px -8px rgba(70, 58, 36, .5); opacity: 0; visibility: hidden; transition: opacity .3s; }
.ov.show + .ov-close, .ov-close.show { opacity: 1; visibility: visible; }
.pj-head { display: grid; gap: 12px; margin-bottom: 26px; }

.facts { margin: 0; display: grid; gap: 8px; }

/* ---------- Étude de cas : modules courts et visuels ---------- */
.ov-card { width: min(1040px, 100%); }

/* Workflows : diagrammes de parcours */
.flowfig { margin: 22px 0 6px; padding: 0; }
.flowfig figcaption { color: var(--p-ink-2); margin-bottom: 10px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 22px 28px; counter-reset: fl; }
.flow li { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px 14px 14px; border-radius: 16px; background: color-mix(in srgb, var(--p-ink) 4%, var(--paper)); box-shadow: inset 0 0 0 1px var(--p-line); }
.flow li b { font-weight: 600; font-size: 15px; line-height: 1.25; }
.flow li span { color: var(--p-ink-2); font-size: 13px; line-height: 1.45; }
.flow li:not(.last):not(.end)::after { content: "→"; position: absolute; right: -22px; top: 50%; transform: translateY(-50%); color: var(--p-accent); font-size: 16px; }
.flow li.end:not(.last)::after { content: "↵"; position: absolute; right: 10px; bottom: -19px; color: var(--p-ink-2); font-size: 13px; opacity: .6; }
.flow.num li::before { counter-increment: fl; content: counter(fl); font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; color: var(--p-accent); }
.fl-tag { align-self: flex-start; font-style: normal; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--p-ink) 8%, transparent); color: var(--p-ink-2); }
.flow li.k-draw { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--p-accent) 45%, transparent); }
.flow li.k-human { background: color-mix(in srgb, var(--p-accent) 10%, var(--paper)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--p-accent) 35%, transparent); }
.flow li.k-human .fl-tag, .flow li.k-draw .fl-tag { background: color-mix(in srgb, var(--p-accent) 18%, transparent); color: var(--p-accent); }
.flow li.k-done .fl-tag { background: color-mix(in srgb, var(--live) 22%, transparent); color: color-mix(in srgb, var(--live) 70%, var(--p-ink)); }
.flow li.k-next { box-shadow: inset 0 0 0 1.5px var(--p-accent); }
.flow li.k-next .fl-tag { background: var(--p-accent); color: var(--paper); }
.flow li.k-later { border: 1px dashed color-mix(in srgb, var(--p-ink) 35%, transparent); box-shadow: none; background: transparent; }
.flowfig + .pj-items { margin-top: 28px; }
.fl-note { margin: 14px 0 0 !important; font-size: 14px !important; color: var(--p-ink-2); max-width: 70ch; }
.screens-wrap { margin: 30px 0 18px; }
.screens-wrap h2 { margin: 0 0 12px; font-weight: 400; color: var(--p-ink-2); }
.screens { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.screens img { width: 100%; height: auto; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--p-line), 0 12px 22px -14px rgba(70, 58, 36, .5); display: block; }
@media (max-width: 760px) {
  .flow { grid-template-columns: 1fr; gap: 26px; }
  .flow li::after { display: none !important; }
  .flow li:not(.last)::after { display: block !important; content: "↓" !important; right: auto !important; left: 18px; top: auto !important; bottom: -24px !important; transform: none !important; opacity: 1 !important; font-size: 16px !important; color: var(--p-accent) !important; }
  .screens { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.gallery .art { aspect-ratio: 4 / 3; border-radius: 14px; }

.xp .per { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--p-ink-2); padding-top: 4px; }
.xp b { display: block; font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.xp .org { display: block; color: var(--p-ink-2); font-size: 15px; margin-top: 2px; }
.xp .projs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.xp .projs a { font-size: 12.5px; padding: 3px 11px; border-radius: 999px; text-decoration: none; color: var(--p-accent); box-shadow: inset 0 0 0 1px var(--p-line); }
.xp .projs a:hover { box-shadow: inset 0 0 0 1px var(--p-accent); }

.about-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }

@media (max-width: 600px) {

/* Bouton pour refermer le dossier (quand la couverture n'est plus visible) */
.fold-btn { display: none; width: max-content; margin: 14px auto 0; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 8px 18px; border-radius: 999px; font-weight: 500; font-size: 14px; cursor: pointer; }
.fold-btn:hover { background: var(--glass-a); }

  body.folder-open .hint { display: none; }

      return '<span class="tool" role="img" style="--r:' + ROT[i % ROT.length] + 'deg;--i:' + i + '" title="' + esc(t) + '" aria-label="' + esc(t) + '"><span class="tool-in">' + glyph(t) + '</span></span>';
    }).join('');
    return '<div class="tools"><div class="tools-head"><span class="mono">Mes outils</span></div><div class="tools-row">' + items + '</div></div>';
  }
  $('#aboutTools').innerHTML = toolsHTML();

  /* --- Autocollant photo --- */
  function stickerHTML() {
    return '<div class="sticker"><div class="sticker-w"><div class="sticker-in"><img src="' + esc(SITE.photo) + '" alt="Portrait de ' + esc(SITE.name) + '" width="675" height="900"></div><div class="peel-w"><i class="peel"></i></div></div>' +
      '<svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 5.2 2.8 8.1 10.5 10.5-7.7 2.4-9.6 5.3-10.5 10.5C11.1 17.3 9.2 14.4 1.5 12 9.2 9.6 11.1 6.7 12 1.5Z"/></svg></div>';
  }
  $('#aboutSticker').innerHTML = stickerHTML();

  /* --- Le dossier --- */
  var scene = $('#scene'), deck = $('#deck'), outside = $('#outside'), inside = $('#inside');
  var sheetsEl = $('#sheets'), dotsEl = $('#dots'), hint = $('#hint'), sheets = [], dots = [], cur = 0, lock = false;

  var narrowMQ = window.matchMedia('(max-width: 939px)');
  function offset() { return narrowMQ.matches ? 1 : 0; }
  function aboutSheetHTML() {
    return '<div class="ab-top"><div class="ab-st">' + stickerHTML() + '</div><div><p class="eyebrow mono">Qui je suis</p><h3>' + esc(SITE.hello) + '</h3></div></div>' +
      '<p class="desc">' + esc(SITE.short) + '</p>' + toolsHTML() +
      '<a class="cta" href="#a-propos"><span>Mon profil</span><span class="cta-ic" aria-hidden="true">→</span></a>';
  }
  function buildSheets() {
    sheetsEl.innerHTML = ''; dotsEl.innerHTML = ''; sheets = []; dots = []; cur = 0;
    (narrowMQ.matches ? [null] : []).concat(P).forEach(function (p, k) {
      var i = k - offset(), s = document.createElement('article');
      s.className = 'sheet' + (p ? '' : ' about-sheet');
      s.innerHTML = p ? '<div class="art">' + visual(p, 0) + '</div><div class="s-body"><div class="s-meta"><span class="eyebrow mono">' + metaLine(p) + '</span><span class="s-count mono">' + (i + 1) + ' / ' + n + '</span></div><h3>' + esc(p.title) + '</h3><p class="desc">' + esc(p.summary) + '</p>' + tags(p) +
        '<a class="cta" href="#' + p.slug + '"><span>Voir le projet</span><span class="cta-ic" aria-hidden="true">→</span></a></div>' : aboutSheetHTML();
      sheetsEl.appendChild(s); sheets.push(s);
      var d = document.createElement('button');
      d.type = 'button'; d.className = 'dot'; d.setAttribute('aria-label', p ? 'Projet ' + (i + 1) + ' : ' + p.name : 'Mon profil');
      d.addEventListener('click', function () { cur = k; render(); });
      dotsEl.appendChild(d); dots.push(d);
    });
    render();
  }
  function render() {
    var N = sheets.length;
    sheets.forEach(function (s, i) {
      var d = i - cur;
      s.dataset.pos = d < 0 ? 'past' : d > 2 ? 'far' : String(d);
      s.inert = d !== 0; s.setAttribute('aria-hidden', d !== 0 ? 'true' : 'false');
    });
    dots.forEach(function (d, i) { d.setAttribute('aria-current', i === cur ? 'true' : 'false'); });
    var pv = $('#prev'), nx = $('#next'), toProfile = narrowMQ.matches && cur === 1;
    pv.disabled = cur === 0; nx.disabled = cur === N - 1;
    pv.classList.toggle('pill', toProfile);
    pv.innerHTML = toProfile ? '<span aria-hidden="true">←</span><span>Profil</span>' : '←';
    pv.setAttribute('aria-label', toProfile ? 'Retour à mon profil' : 'Feuille précédente');
  }
  function next() { if (cur < sheets.length - 1) { cur++; render(); } }
  function prev() { if (cur > 0) { cur--; render(); } }
  /* Glisser le doigt change de feuille (pas de boucle : on s'arrête au premier et au dernier). */
  (function () {
    var box = $('#sheets'), sx = 0, sy = 0, on = false, swipedAt = 0;
    box.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') return; on = true; sx = e.clientX; sy = e.clientY; }, { passive: true });
    box.addEventListener('pointerup', function (e) {
      if (!on) return; on = false;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) { swipedAt = Date.now(); if (dx < 0) next(); else prev(); }
    }, { passive: true });
    box.addEventListener('pointercancel', function () { on = false; }, { passive: true });
    box.addEventListener('click', function (e) { if (Date.now() - swipedAt < 450) { e.preventDefault(); e.stopPropagation(); } }, true);
  })();
  function hintText(v) {
    var small = narrowMQ.matches;
    return v ? (small ? 'Glissez pour changer de page, touchez pour ouvrir.' : 'Cliquez sur une feuille pour ouvrir le projet. Les flèches changent de feuille.') : (small ? 'Touchez le dossier pour l’ouvrir.' : 'Cliquez sur le dossier pour l’ouvrir.');
  }
  function setOpen(v, focus) {
    scene.classList.toggle('open', v);
    deck.inert = !v; outside.inert = v; inside.inert = !v; tilt();
    hint.textContent = hintText(v); document.body.classList.toggle('folder-open', v);
    if (focus) setTimeout(function () { (v ? $('#next') : $('#openBtn')).focus({ preventScroll: true }); }, 750);
  }
  $('#cover').addEventListener('click', function () { if (!scene.classList.contains('open')) setOpen(true, true); });
  $('#closeBtn').addEventListener('click', function (e) { e.stopPropagation(); setOpen(false, true); });
  $('#foldBtn').addEventListener('click', function () { setOpen(false, false); });
  $('#next').addEventListener('click', next);
  $('#prev').addEventListener('click', prev);
  buildSheets();
  hint.textContent = hintText(false);
  var onNarrow = function () { buildSheets(); hint.textContent = hintText(scene.classList.contains('open')); };
  if (narrowMQ.addEventListener) narrowMQ.addEventListener('change', onNarrow); else if (narrowMQ.addListener) narrowMQ.addListener(onNarrow);

  /* --- Inclinaison 3D : position de repos selon l'état, puis légère réaction à la souris --- */
  var rig = $('#rig'), ptr = { x: 0, y: 0 }, ang = (window.matchMedia('(max-width: 600px)').matches ? { rx: 6, ry: -8 } : { rx: 11, ry: -22 }), raf = 0;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function restAngles() {
    var small = window.matchMedia('(max-width: 600px)').matches, open = scene.classList.contains('open');
    return small ? (open ? { rx: 5, ry: -2 } : { rx: 6, ry: -8 }) : (open ? { rx: 11, ry: -5 } : { rx: 11, ry: -22 });
  }
  function paint() { rig.style.transform = 'rotateX(' + ang.rx.toFixed(2) + 'deg) rotateY(' + ang.ry.toFixed(2) + 'deg)'; }
  function frame() {
    var b = restAngles(), tx = b.rx - ptr.y * 5, ty = b.ry + ptr.x * 8;
    ang.rx += (tx - ang.rx) * .08; ang.ry += (ty - ang.ry) * .08;
    paint();
    raf = (Math.abs(tx - ang.rx) > .02 || Math.abs(ty - ang.ry) > .02) ? requestAnimationFrame(frame) : 0;
  }
  function tilt() { if (reduceMotion) { var b = restAngles(); ang.rx = b.rx; ang.ry = b.ry; paint(); } else if (!raf) raf = requestAnimationFrame(frame); }
  document.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    ptr.x = e.clientX / window.innerWidth * 2 - 1; ptr.y = e.clientY / window.innerHeight * 2 - 1;
    if (!reduceMotion) tilt();
  }, { passive: true });
  paint();

  /* --- Calque : page projet et À propos --- */
  var ov = $('#ov'), ovBody = $('#ovBody'), ovClose = $('#ovClose'), lastFocus = null;
  function itemHTML(it) {
    if (Array.isArray(it)) return '<li><b>' + esc(it[0]) + '</b><span>' + esc(it[1]) + '</span></li>';
    return '<li class="rich"><b>' + esc(it.t) + '</b>' + it.parts.map(function (pt) { return '<span><em>' + esc(pt[0]) + '</em>' + esc(pt[1]) + '</span>'; }).join('') + '</li>';
  }
  function flowHTML(f) {
    var cols = f.cols || 4;
    return '<figure class="flowfig">' + (f.caption ? '<figcaption class="mono">' + esc(f.caption) + '</figcaption>' : '') +
      '<ol class="flow' + (f.numbered ? ' num' : '') + '" style="--cols:' + cols + '">' + f.steps.map(function (st, i) {
        var cls = ((i + 1) % cols === 0 ? 'end ' : '') + (i === f.steps.length - 1 ? 'last ' : '') + (st.kind ? 'k-' + st.kind : '');
        return '<li class="' + cls + '">' + (st.tag ? '<em class="fl-tag">' + esc(st.tag) + '</em>' : '') + '<b>' + esc(st.t) + '</b>' + (st.d ? '<span>' + esc(st.d) + '</span>' : '') + '</li>';
      }).join('') + '</ol>' + (f.note ? '<p class="fl-note">' + esc(f.note) + '</p>' : '') + '</figure>';
  }
  function sectionHTML(sec) {
    if (Array.isArray(sec)) return '<section><h2>' + esc(sec[0]) + '</h2><p>' + esc(sec[1]) + '</p></section>';
    var quotes = sec.quotes || (sec.quote ? [sec.quote] : []);
    return '<section><h2>' + esc(sec.title) + '</h2>' +
      (sec.text || []).map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') +
      (sec.flows || []).map(flowHTML).join('') +
      (sec.items ? '<ol class="pj-items' + (sec.numbered ? ' num' : '') + '">' + sec.items.map(itemHTML).join('') + '</ol>' : '') +
      quotes.map(function (q) { return '<blockquote class="pj-quote"><p>' + esc(q[0]) + '</p><cite>' + esc(q[1]) + '</cite></blockquote>'; }).join('') +
      (sec.note ? '<p class="pj-note">' + esc(sec.note) + '</p>' : '') + '</section>';
  }
  function galleryHTML(p, used) {
    used = used || {};
    if (p.images && p.images.length > 1) {
      var rest = p.images.map(function (src, k) { return k > 0 && !used[k] ? '<div class="shot"><img src="' + esc(src) + '" alt="' + esc((p.imageAlts && p.imageAlts[k]) || (p.title + ', image ' + (k + 1))) + '" loading="lazy"></div>' : ''; }).join('');
      return rest ? '<div class="gallery">' + rest + '</div>' : '';
    }
    return '';
  }
  function widen() {
    Array.prototype.forEach.call(document.querySelectorAll('#ovBody .shot img'), function (img) {
      var mark = function () { if (img.naturalWidth / img.naturalHeight > 1.9) img.parentNode.classList.add('wide'); };
      if (img.complete) mark(); else img.addEventListener('load', mark);
    });
  }
  function modHTML(m, p, used) {
    var i;
    if (m.t === 'cards') return '<div class="cs-cards c' + (m.cols || 2) + '">' + m.items.map(function (it, k) { return '<article class="cs-card">' + (m.numbered ? '<span class="cs-ix mono">' + (k + 1) + '</span>' : '') + '<b>' + esc(it[0]) + '</b><p>' + esc(it[1]) + '</p></article>'; }).join('') + '</div>';
    if (m.t === 'pairs') return '<div class="cs-pairs">' + m.items.map(function (it) {
      var cols = '';
      m.labels.forEach(function (lb, k) { if (it[k + 1]) cols += '<div><em>' + esc(lb) + '</em><p>' + esc(it[k + 1]) + '</p></div>'; });
      return '<article class="cs-pair"><h3>' + esc(it[0]) + '</h3><div class="cs-pc">' + cols + '</div></article>';
    }).join('') + '</div>';
    if (m.t === 'timeline') return '<div class="cs-panel"><div class="cs-tl" style="--cols:' + m.cols.length + '">' + m.cols.map(function (c) { return '<div class="cs-col"><h4 class="mono">' + esc(c.h) + '</h4><i class="cs-dot"></i><ul>' + c.li.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>'; }).join('') + '</div></div>';
    if (m.t === 'flow') return '<div class="cs-panel">' + flowHTML(m) + '</div>';
    if (m.t === 'stats') return '<div class="cs-stats">' + m.items.map(function (it) { return '<div><b>' + esc(it[0]) + '</b><span>' + esc(it[1]) + '</span></div>'; }).join('') + '</div>';
    if (m.t === 'quotes') return '<div class="cs-quotes">' + m.items.map(function (it) { return '<blockquote><p>' + esc(it[0]) + '</p><cite>' + esc(it[1]) + '</cite></blockquote>'; }).join('') + '</div>';
    if (m.t === 'image') { used[m.k] = 1; return '<figure class="cs-img"><div class="shot"><img src="' + esc(p.images[m.k]) + '" alt="' + esc((p.imageAlts && p.imageAlts[m.k]) || (p.title + ', image ' + (m.k + 1))) + '" loading="lazy"></div>' + (m.cap ? '<figcaption>' + esc(m.cap) + '</figcaption>' : '') + '</figure>'; }
    if (m.t === 'bullets') return '<ul class="cs-bullets">' + m.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    if (m.t === 'note') return '<p class="pj-note">' + esc(m.text) + '</p>';
    if (m.t === 'screens' && p.screens) return '<div class="screens-wrap"><h2 class="mono">' + esc(p.screensTitle || 'Écrans') + '</h2><div class="screens">' + p.screens.map(function (sc) { return '<img src="' + esc(sc.src) + '" alt="' + esc(sc.alt) + '" loading="lazy">'; }).join('') + '</div></div>';
    return '';
  }
  function projectHTML(p, i) {
    var prev = P[(i - 1 + n) % n], nxt = P[(i + 1) % n], used = {}, st = p.story;
    var secs = st.sections.map(function (sc) {
      return '<section class="cs-sec"><header class="cs-sh"><p class="mono">' + esc(sc.n) + '. ' + esc(sc.label) + '</p><h2>' + esc(sc.title) + '</h2>' + (sc.intro ? '<p class="cs-intro">' + esc(sc.intro) + '</p>' : '') + '</header>' + sc.mods.map(function (m) { return modHTML(m, p, used); }).join('') + '</section>';
    }).join('');
    return '<nav class="cs-crumb" aria-label="Fil d’Ariane"><span>' + esc(SITE.name) + '</span><i>/</i><b>' + esc(p.name) + '</b></nav>' +
      '<header class="cs-head"><h1 id="ovTitle">' + esc(p.title) + '</h1><p class="mono cs-kicker">01. Aperçu · ' + (i + 1) + ' / ' + n + ' · ' + metaLine(p) + '</p><p class="cs-lead">' + esc(st.lead) + '</p></header>' +
      '<div class="art hero">' + visual(p, 0) + '</div>' +
      '<dl class="facts row">' + (p.org ? '<div><dt>Client</dt><dd>' + esc(p.org) + '</dd></div>' : '') + '<div><dt>Rôle</dt><dd>' + esc(p.role) + '</dd></div>' + (p.period ? '<div><dt>Période</dt><dd>' + esc(p.period) + '</dd></div>' : '') + (p.dur ? '<div><dt>Durée</dt><dd>' + esc(p.dur) + '</dd></div>' : '') + (p.tools ? '<div><dt>Outils</dt><dd>' + esc(p.tools) + '</dd></div>' : '') + '</dl>' +
      secs + galleryHTML(p, used) +
      '<nav class="pj-nav" aria-label="Autres projets"><a href="#' + prev.slug + '"><span class="mono">← Précédent</span><b>' + esc(prev.name) + '</b></a><a href="#' + nxt.slug + '"><span class="mono">Suivant →</span><b>' + esc(nxt.name) + '</b></a></nav>';
  }
  function projLinks(slugs) {
    var out = (slugs || []).map(function (sl) { var q = null; P.forEach(function (p) { if (p.slug === sl) q = p; }); return q ? '<a href="#' + q.slug + '">' + esc(q.name) + '</a>' : ''; }).join('');
    return out ? '<div class="projs">' + out + '</div>' : '';
  }
  function experienceHTML() {
    var xp = (SITE.experience || []).map(function (x) {
      return '<li><span class="per">' + esc(x.period) + '</span><div><b>' + esc(x.role) + '</b><span class="org">' + esc(x.org) + '</span>' + projLinks(x.projects) + '</div></li>';
    }).join('');
    var ed = (SITE.education || []).map(function (x) {
      return '<li><span class="per">Formation</span><div><b>' + esc(x.title) + '</b><span class="org">' + esc(x.school) + '</span>' + projLinks(x.projects) + '</div></li>';
    }).join('');
    return '<section class="xp-wrap"><h2 class="mono">Parcours</h2><ol class="xp">' + xp + ed + '</ol></section>';
  }
  function aboutHTML() {
    return '<div class="about-hero">' + stickerHTML() + '<header class="pj-head"><p class="eyebrow mono">À propos</p><h1 id="ovTitle">' + esc(SITE.hello) + '</h1></header></div>' +
      '<div class="pj-sections">' + SITE.about.map(function (t) { return '<section><p>' + esc(t) + '</p></section>'; }).join('') + '</div>' +
      experienceHTML() +
      '<div class="about-tools">' + toolsHTML() + '</div>' +
      '<dl class="facts row"><div><dt>Contact</dt><dd>' + esc(SITE.email) + '</dd></div></dl>' +
      '<div class="about-links"><a class="main" href="mailto:' + esc(SITE.email) + '">Écrire un message</a>' + SITE.links.map(function (l) { return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>'; }).join('') + '</div>';
  }
  function showOverlay(html) {
    if (!ov.classList.contains('show')) lastFocus = document.activeElement;
    ovBody.innerHTML = html;
    widen();
    ov.scrollTop = 0;
    ov.classList.add('show'); ovClose.classList.add('show'); document.body.classList.add('ov-open');
    $('#top').inert = true; $('#main').inert = true; $('#footer').inert = true;
    document.body.style.overflow = 'hidden';
    ovClose.focus({ preventScroll: true });
  }
  function hideOverlay() {
    if (!ov.classList.contains('show')) return;
    ov.classList.remove('show'); ovClose.classList.remove('show'); document.body.classList.remove('ov-open');
    $('#top').inert = false; $('#main').inert = false; $('#footer').inert = false;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function route() {
    var h = decodeURIComponent(location.hash.slice(1)), idx = -1;
    P.forEach(function (p, i) { if (p.slug === h) idx = i; });
    if (idx >= 0) {
      if (!scene.classList.contains('open')) setOpen(true, false);
      cur = idx + offset(); render(); showOverlay(projectHTML(P[idx], idx));
    } else if (h === 'a-propos') showOverlay(aboutHTML());
    else hideOverlay();
  }
  function closeOverlay() { history.pushState(null, '', location.pathname + location.search); route(); }
  ovClose.addEventListener('click', closeOverlay);
  ov.addEventListener('click', function (e) { if (e.target === ov) closeOverlay(); });
  window.addEventListener('hashchange', route);
  route();

  document.addEventListener('keydown', function (e) {
    if (ov.classList.contains('show')) {
      if (e.key === 'Escape') closeOverlay();
      else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && P.some(function (p) { return '#' + p.slug === location.hash; })) {
        var h = decodeURIComponent(location.hash.slice(1)), at = 0;
        P.forEach(function (p, j) { if (p.slug === h) at = j; });
        location.hash = P[(at + (e.key === 'ArrowRight' ? 1 : -1) + n) % n].slug;
      }
      return;
    }
    if (!scene.classList.contains('open')) return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'Escape') setOpen(false, true);
  });
})();
</script>
</body>
