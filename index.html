<title>Guillaume Gaudin — Product Designer</title>
<meta name="description" content="Portfolio de Guillaume Gaudin, Product Designer. Ses projets sont rangés dans un dossier à ouvrir.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='7' width='22' height='20' rx='5' fill='%23efebe4' stroke='%23b8b2a4'/%3E%3Ccircle cx='21' cy='13' r='2.5' fill='%238fb3a0'/%3E%3C/svg%3E">

<style>
/* Glace et perle : fond beige clair, surfaces de verre dépoli, couleur en petites touches. */
:root {
  --bg: #efebe4;
  --orb-1: rgba(190, 210, 228, .75);
  --orb-2: rgba(238, 208, 188, .65);
  --veil: rgba(239, 235, 228, .62);
  --ink: #2b2a27;
  --ink-2: #77736a;
  --line: rgba(60, 50, 30, .12);
  --accent: #5f82ad;
  --live: #2fa56b;

  --glass-a: rgba(255, 255, 255, .74);
  --glass-b: rgba(255, 255, 255, .32);
  --glass-edge: rgba(255, 255, 255, .95);
  --face-a: #fffefc;
  --face-b: #efebe2;
  --surf: #fdfcfa;
  --pill-on: #ffffff;
  --sheen: linear-gradient(115deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 45%);
  --shadow: 0 40px 70px -38px rgba(70, 58, 36, .42), 0 14px 26px -18px rgba(70, 58, 36, .22);

  --paper: #fdfcf9;
  --p-ink: #2b2a27;
  --p-ink-2: #77736a;
  --p-line: rgba(60, 50, 30, .1);
  --p-accent: #4f729d;

  --tab-1: #8fb3a0;
  --tab-2: #7f9bd0;
  --tab-3: #e0a98f;
  --tab-4: #d8c27a;
  --tab-5: #a99ad0;

  --font-display: "Outfit", "Futura", "Avenir Next", "Century Gothic", sans-serif;
  --font-mono: "Outfit", "Futura", "Avenir Next", "Century Gothic", sans-serif;

  --fw: min(430px, calc(100vw - 48px));
  --fh: calc(var(--fw) * 1.3);
  --tabh: 28px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --orb-1: rgba(70, 96, 128, .45); --orb-2: rgba(130, 90, 66, .32); --veil: rgba(18, 20, 23, .66);
    --ink: #ecebe6; --ink-2: #9a978f; --line: rgba(255, 255, 255, .14); --accent: #9db8dc; --live: #5fd39a;
    --glass-a: rgba(255, 255, 255, .11); --glass-b: rgba(255, 255, 255, .04); --glass-edge: rgba(255, 255, 255, .2);
    --face-a: #2d3137; --face-b: #22252a; --surf: #2d3138; --pill-on: rgba(255, 255, 255, .14);
    --sheen: linear-gradient(115deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 45%);
    --shadow: 0 40px 70px -38px rgba(0, 0, 0, .85), 0 14px 26px -18px rgba(0, 0, 0, .6);
    --paper: #23262b; --p-ink: #ecebe6; --p-ink-2: #9a978f; --p-line: rgba(255, 255, 255, .1); --p-accent: #9db8dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --orb-1: rgba(70, 96, 128, .45); --orb-2: rgba(130, 90, 66, .32); --veil: rgba(18, 20, 23, .66);
  --ink: #ecebe6; --ink-2: #9a978f; --line: rgba(255, 255, 255, .14); --accent: #9db8dc; --live: #5fd39a;
  --glass-a: rgba(255, 255, 255, .11); --glass-b: rgba(255, 255, 255, .04); --glass-edge: rgba(255, 255, 255, .2);
  --face-a: #2d3137; --face-b: #22252a; --surf: #2d3138; --pill-on: rgba(255, 255, 255, .14);
  --sheen: linear-gradient(115deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 45%);
  --shadow: 0 40px 70px -38px rgba(0, 0, 0, .85), 0 14px 26px -18px rgba(0, 0, 0, .6);
  --paper: #23262b; --p-ink: #ecebe6; --p-ink-2: #9a978f; --p-line: rgba(255, 255, 255, .1); --p-accent: #9db8dc;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(55% 45% at 12% 8%, var(--orb-1), transparent 70%),
    radial-gradient(50% 45% at 92% 88%, var(--orb-2), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 400 15px/1.5 var(--font-display);
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
img { max-width: 100%; }
.mono { font-family: var(--font-mono); letter-spacing: .15em; text-transform: uppercase; font-size: 11px; font-weight: 500; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.swatches { display: inline-flex; gap: 6px; align-items: center; }
.swatches i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

/* ---------- En-tête ---------- */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center; width: 100%; max-width: 1100px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; line-height: 1.2; text-decoration: none; }
.brand b { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.brand span { color: var(--ink-2); font-size: 13px; }
.nav { display: flex; align-items: center; gap: 4px; }
.nav a { text-decoration: none; padding: 8px 16px; border-radius: 999px; font-weight: 500; font-size: 14px; color: var(--ink-2); transition: background .25s, color .25s; }
.nav a:hover { color: var(--ink); background: var(--glass-a); }
.nav a.pill { color: var(--ink); background: linear-gradient(150deg, var(--glass-a), var(--glass-b)); box-shadow: inset 0 0 0 1px var(--glass-edge), 0 8px 20px -14px rgba(70, 58, 36, .35); }
.hint { text-align: center; color: var(--ink-2); margin: 6px 0 0; font-size: 14px; min-height: 1.5em; }
.stage { position: relative; display: grid; place-items: center; padding: calc(var(--tabh) + 16px) 0 10px; overflow-x: clip; }

/* Pastille « disponible » */
.live-wrap { display: flex; justify-content: center; margin-top: 24px; }
.live {
  display: inline-flex; align-items: center; gap: 10px; margin: 0; padding: 8px 16px 8px 14px; border-radius: 999px;
  font-size: 14px; font-weight: 500;
  background: linear-gradient(150deg, var(--glass-a), var(--glass-b));
  box-shadow: inset 0 0 0 1px var(--glass-edge), 0 10px 24px -16px rgba(70, 58, 36, .4);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.live-dot { position: relative; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 10px color-mix(in srgb, var(--live) 70%, transparent); }
.live-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--live); animation: ping 2.2s cubic-bezier(0, 0, .2, 1) infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .55; } 75%, 100% { transform: scale(3.2); opacity: 0; } }

/* Pied de page */
.foot { width: 100%; max-width: 1100px; margin: auto auto 0; padding-top: 36px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; color: var(--ink-2); }
.foot-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.btn-in, .theme {
  color: var(--ink); border: 0; cursor: pointer; text-decoration: none;
  background: linear-gradient(150deg, var(--glass-a), var(--glass-b));
  box-shadow: inset 0 0 0 1px var(--glass-edge), 0 8px 20px -14px rgba(70, 58, 36, .4);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: transform .2s;
}
.btn-in:hover, .theme:hover { transform: translateY(-2px); }
.btn-in { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.btn-in svg { width: 16px; height: 16px; fill: currentColor; }
.theme { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme .sun { display: none; }
.theme.is-dark .sun { display: block; }
.theme.is-dark .moon { display: none; }

/* ---------- Éléments communs ---------- */
.tabx {
  position: absolute; top: calc(-1 * var(--tabh)); height: calc(var(--tabh) + 1px); width: 128px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 12px 12px 0 0; color: var(--ink-2);
  background: linear-gradient(180deg, var(--face-a), var(--face-b));
  box-shadow: inset 0 0 0 1px var(--glass-edge), 0 -6px 14px -10px rgba(70, 58, 36, .3);
  clip-path: inset(-20px -20px 0 -20px);
}
.art { border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; flex: none; background: #e9e5db; }
.art svg, .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
.eyebrow { margin: 0; color: var(--p-ink-2); }
.desc { margin: 0; font-size: 14px; line-height: 1.55; color: var(--p-ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; border: 1px solid var(--p-line); padding: 3px 9px; border-radius: 999px; color: var(--p-ink-2); }
.more { align-self: flex-start; border: 0; background: none; padding: 2px 0; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--p-accent); border-bottom: 1px solid currentColor; }
.more:hover { opacity: .7; }

/* ---------- Le dossier (vraie 3D : épaisseur, tranches, charnière) ---------- */
.scene {
  --T: 44px; /* altitude du milieu de la couverture */
  --H: 42px; /* épaisseur du paquet de feuilles */
  position: relative; width: var(--fw); height: var(--fh);
  perspective: 1800px; perspective-origin: 50% 40%;
  transition: transform .95s cubic-bezier(.5, .1, .2, 1), perspective-origin .95s cubic-bezier(.5, .1, .2, 1);
}
.scene.open { transform: translateX(calc(var(--fw) / 2)); perspective-origin: 0 40%; }
.rig {
  position: absolute; inset: 0; transform-style: preserve-3d;
  transform: rotateX(11deg) rotateY(-22deg); transform-origin: 50% 50% 0;
  transition: transform-origin .95s cubic-bezier(.5, .1, .2, 1);
}
.scene.open .rig { transform-origin: 0 50% 0; }
.rig > *, .deck > *, .hingepos > .cover { position: absolute; }

.floor { position: absolute; left: -4%; width: 108%; bottom: -34px; height: 46px; background: radial-gradient(closest-side, rgba(24, 18, 8, .5), transparent); filter: blur(9px); transition: left .95s cubic-bezier(.5, .1, .2, 1), width .95s cubic-bezier(.5, .1, .2, 1); pointer-events: none; }
.scene.open .floor { left: -104%; width: 208%; }

/* Fond du dossier */
.board {
  inset: 0; border-radius: 6px 18px 18px 6px;
  background: linear-gradient(150deg, var(--face-b), color-mix(in srgb, var(--face-b) 86%, #000));
  box-shadow: inset 0 0 0 1px var(--glass-edge);
}
.board::after, .outside::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 26px; border-radius: inherit; background: linear-gradient(90deg, rgba(70, 58, 36, .1), transparent); pointer-events: none; }
.board .tabx { right: 30px; }

/* Tranches du paquet de feuilles */
.side { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.s-right { left: calc(100% - var(--H) / 2); top: 18px; width: var(--H); height: calc(100% - 36px); transform: translateZ(calc(var(--H) / 2)) rotateY(90deg); background: repeating-linear-gradient(90deg, var(--paper) 0 2px, color-mix(in srgb, var(--p-ink) 24%, var(--paper)) 2px 3px); }
.s-bottom { left: 6px; width: calc(100% - 24px); top: calc(100% - var(--H) / 2); height: var(--H); transform: translateZ(calc(var(--H) / 2)) rotateX(-90deg); background: repeating-linear-gradient(180deg, var(--paper) 0 2px, color-mix(in srgb, var(--p-ink) 28%, var(--paper)) 2px 3px); }
.s-top { left: 6px; width: calc(100% - 24px); top: calc(0px - var(--H) / 2); height: var(--H); transform: translateZ(calc(var(--H) / 2)) rotateX(90deg); background: repeating-linear-gradient(180deg, var(--paper) 0 2px, color-mix(in srgb, var(--p-ink) 20%, var(--paper)) 2px 3px); }
.s-spine { left: calc(0px - var(--H) / 2); top: 6px; width: var(--H); height: calc(100% - 12px); transform: translateZ(calc(var(--H) / 2)) rotateY(-90deg); background: linear-gradient(90deg, color-mix(in srgb, var(--face-b) 78%, #000), var(--face-b)); }

/* Feuilles : chacune à sa propre altitude */
.deck { inset: 0; transform-style: preserve-3d; }
.pocket { left: 30px; right: 24px; top: 26px; bottom: 76px; transform-style: preserve-3d; }
.sheet {
  position: absolute; inset: 0; background: var(--paper); color: var(--p-ink);
  border-radius: 16px; padding: 14px;
  box-shadow: inset 0 0 0 1px var(--p-line), 0 14px 26px -16px rgba(70, 58, 36, .4);
  display: flex; flex-direction: column; gap: 12px;
  transition: transform .55s cubic-bezier(.3, .7, .2, 1), opacity .4s;
  cursor: pointer; overflow: hidden;
}
.sheet[data-pos="0"] { transform: translate3d(0, 0, 30px); }
.sheet[data-pos="1"] { transform: translate3d(6px, 6px, 20px) rotate(1deg); }
.sheet[data-pos="2"] { transform: translate3d(-4px, 11px, 12px) rotate(-1.2deg); }
.sheet:not([data-pos="0"]):not([data-pos="1"]):not([data-pos="2"]) { opacity: 0; transform: translate3d(0, 12px, 4px); }
.sheet.fly { opacity: 0; transform: translate3d(118%, -8%, 34px) rotate(12deg); }
.s-body { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.sheet h3 { margin: 0; font-size: 24px; line-height: 1.12; letter-spacing: -.02em; font-weight: 600; text-wrap: balance; }

.pager { left: 30px; right: 24px; bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; transform: translateZ(10px); }
.circ { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surf); color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 16px; box-shadow: inset 0 0 0 1px var(--glass-edge), 0 6px 14px -8px rgba(70, 58, 36, .45); transition: transform .2s; }
.circ:hover { transform: scale(1.07); }
.dots { display: flex; gap: 8px; align-items: center; }
.dot { position: relative; width: 6px; height: 6px; padding: 0; border: 0; border-radius: 999px; background: var(--ink-2); opacity: .35; cursor: pointer; transition: width .3s, background .3s, opacity .3s; }
.dot::after { content: ""; position: absolute; inset: -9px -5px; }
.dot[aria-current="true"] { width: 22px; background: var(--accent); opacity: 1; }


/* Cartes projet : toute la feuille est cliquable, le bouton dit clairement quoi faire */
.sheet .art { aspect-ratio: 2 / 1; }
.sheet .art svg, .sheet .art img { transition: transform .7s cubic-bezier(.3, .7, .2, 1); }
.sheet:hover .art svg, .sheet:hover .art img { transform: scale(1.05); }
.s-body { flex: 1; }
.s-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.s-count { color: var(--p-ink-2); }
.sheet h3 { font-size: 22px; }
.sheet .desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cta {
  margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 14px;
  padding: 5px 5px 5px 18px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px;
  background: var(--p-ink); color: var(--paper); transition: background .25s, box-shadow .25s;
}
.cta::after { content: ""; position: absolute; inset: 0; border-radius: 16px; } /* rend toute la feuille cliquable */
.cta-ic { width: 32px; height: 32px; border-radius: 50%; background: var(--paper); color: var(--p-ink); display: grid; place-items: center; font-size: 16px; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); }
.sheet:hover .cta { background: var(--p-accent); }
.sheet:hover .cta-ic { transform: translateX(3px); }
.sheet[data-pos="0"]:hover { transform: translate3d(0, -3px, 36px); box-shadow: inset 0 0 0 1px var(--p-line), 0 22px 32px -16px rgba(70, 58, 36, .5); }
.sheet:has(.cta:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
.cta:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--accent); }

/* Couverture : charnière sur la tranche gauche, épaisseur de 4 px */
.hingepos { inset: 0; transform-style: preserve-3d; transform: translateZ(calc(var(--T) / 2)); pointer-events: none; }
.cover { inset: 0; transform-style: preserve-3d; transform-origin: 0 50% 0; transition: transform 1s cubic-bezier(.55, .05, .2, 1); pointer-events: none; }
.cmid { position: absolute; inset: 0; transform-style: preserve-3d; transform: translateZ(calc(var(--T) / 2)); pointer-events: none; }
.scene:not(.open) .cover:hover { transform: rotateY(-15deg); }
.scene.open .cover { transform: rotateY(-180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; pointer-events: auto;
  background: linear-gradient(150deg, var(--face-a), var(--face-b));
  box-shadow: inset 0 0 0 1px var(--glass-edge);
}
.face::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--sheen); pointer-events: none; }
.outside { border-radius: 6px 18px 18px 6px; transform: translateZ(2px); }
.scene:not(.open) .outside { cursor: pointer; }
.outside .tabx { right: 30px; }
.inside { border-radius: 18px 6px 6px 18px; transform: rotateY(180deg) translateZ(2px); }
.inside::after { content: ""; position: absolute; inset: 0 0 0 auto; width: 26px; border-radius: inherit; background: linear-gradient(270deg, rgba(70, 58, 36, .1), transparent); pointer-events: none; }
.inside .tabx { left: 30px; }
.cedge { position: absolute; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: color-mix(in srgb, var(--face-b) 82%, #000); }
.ce-r { top: 18px; bottom: 18px; right: -2px; width: 4px; transform: rotateY(90deg); }
.ce-t { left: 6px; right: 18px; top: -2px; height: 4px; transform: rotateX(90deg); }
.ce-b { left: 6px; right: 18px; bottom: -2px; height: 4px; transform: rotateX(-90deg); }

.cv { position: absolute; inset: 34px 32px 30px 44px; display: flex; flex-direction: column; justify-content: space-between; }
.cv-top { display: flex; justify-content: flex-end; align-items: center; color: var(--ink-2); min-height: 8px; }
.cv h2 { margin: 0 0 10px; font-size: clamp(36px, 11vw, 52px); line-height: .98; letter-spacing: -.03em; font-weight: 500; }
.cv p { margin: 0; color: var(--ink-2); }
.cv-row { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--ink-2); }
.open-btn { border: 0; cursor: pointer; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; padding: 11px 20px; border-radius: 999px; transition: transform .2s; }
.open-btn:hover { transform: translateX(3px); }

.note { position: absolute; left: 32px; right: 44px; top: 34px; bottom: 84px; color: var(--ink); }
.note p { margin: 0; font-size: 14px; color: var(--ink-2); }
.note h3 { margin: 10px 0 12px; font-size: 28px; line-height: 1.08; letter-spacing: -.025em; font-weight: 500; }
.note dl { margin: 20px 0 0; display: grid; gap: 10px; }
.note dl div { display: grid; grid-template-columns: 92px 1fr; gap: 8px; border-top: 1px solid var(--line); padding-top: 9px; }
.note dt { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: var(--ink-2); padding-top: 2px; }
.note dd { margin: 0; font-size: 14px; }
.close-btn { position: absolute; left: 32px; bottom: 28px; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 9px 18px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 14px; }
.close-btn:hover { background: var(--glass-a); }

@media (max-width: 939px) {
  .scene.open { transform: none; perspective-origin: 0 40%; }
  .scene.open .floor { left: -4%; width: 108%; }
  .scene.open .cover { visibility: hidden; transition: transform 1s cubic-bezier(.55, .05, .2, 1), visibility 0s .95s; }
}

/* ---------- Autocollants (photo) ---------- */
.sticker { --sw: 140px; position: relative; width: var(--sw); aspect-ratio: 4 / 5; flex: none; transform: rotate(-4deg); transition: transform .45s cubic-bezier(.3, .7, .2, 1); filter: drop-shadow(0 1px 0 rgba(40, 30, 15, .1)) drop-shadow(0 12px 14px rgba(40, 30, 15, .28)); }
.sticker:hover { transform: rotate(-1deg) scale(1.03); }
.sticker-w { position: absolute; inset: 0; }
.sticker-in {
  position: absolute; inset: 0; padding: 6px; background: #fff;
  border-radius: calc(var(--sw) / 2) calc(var(--sw) / 2) 18px 18px;

  function widen() {
    Array.prototype.forEach.call(document.querySelectorAll('#ovBody .shot img'), function (img) {
      var mark = function () { if (img.naturalWidth / img.naturalHeight > 1.9) img.parentNode.classList.add('wide'); };
      if (img.complete) mark(); else img.addEventListener('load', mark);
    });
  }
  function projectHTML(p, i) {
    var prev = P[(i - 1 + n) % n], nxt = P[(i + 1) % n];
    return '<header class="pj-head"><p class="eyebrow mono">' + (i + 1) + ' / ' + n + ' · ' + metaLine(p) + '</p><h1 id="ovTitle">' + esc(p.title) + '</h1><p class="lead">' + esc(p.summary) + '</p></header>' +
      '<div class="art hero">' + visual(p, 0) + '</div>' +
      '<dl class="facts row">' + (p.org ? '<div><dt>Client</dt><dd>' + esc(p.org) + '</dd></div>' : '') + '<div><dt>Rôle</dt><dd>' + esc(p.role) + '</dd></div>' + (p.period ? '<div><dt>Période</dt><dd>' + esc(p.period) + '</dd></div>' : '') + (p.dur ? '<div><dt>Durée</dt><dd>' + esc(p.dur) + '</dd></div>' : '') + (p.tools ? '<div><dt>Outils</dt><dd>' + esc(p.tools) + '</dd></div>' : '') + '</dl>' +
      (p.highlight ? '<div class="pj-key"><b>' + esc(p.highlight.value) + '</b><span>' + esc(p.highlight.label) + '</span></div>' : '') +
      '<div class="pj-sections">' + p.sections.map(sectionHTML).join('') + '</div>' +
      (p.screens ? '<div class="screens-wrap"><h2 class="mono">' + esc(p.screensTitle || 'Écrans') + '</h2><div class="screens">' + p.screens.map(function (sc) { return '<img src="' + esc(sc.src) + '" alt="' + esc(sc.alt) + '" loading="lazy">'; }).join('') + '</div></div>' : '') +
      galleryHTML(p) +
      '<nav class="pj-nav" aria-label="Autres projets"><a href="#' + prev.slug + '"><span class="mono">← Précédent</span><b>' + esc(prev.name) + '</b></a><a href="#' + nxt.slug + '"><span class="mono">Suivant →</span><b>' + esc(nxt.name) + '</b></a></nav>';
  }
  function aboutHTML() {
    return '<div class="about-hero">' + stickerHTML() + '<header class="pj-head"><p class="eyebrow mono">À propos</p><h1 id="ovTitle">' + esc(SITE.hello) + '</h1></header></div>' +
      '<div class="pj-sections">' + SITE.about.map(function (t) { return '<section><p>' + esc(t) + '</p></section>'; }).join('') + '</div>' +
      '<div class="about-tools">' + toolsHTML() + '</div>' +
      '<dl class="facts row"><div><dt>Contact</dt><dd>' + esc(SITE.email) + '</dd></div></dl>' +
      '<div class="about-links"><a class="main" href="mailto:' + esc(SITE.email) + '">Écrire un message</a>' + SITE.links.map(function (l) { return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>'; }).join('') + '</div>';
  }
  function showOverlay(html) {
    if (!ov.classList.contains('show')) lastFocus = document.activeElement;
    ovBody.innerHTML = html;
    widen();
    ov.scrollTop = 0;
    ov.classList.add('show'); ovClose.classList.add('show');
    $('#top').inert = true; $('#main').inert = true; $('#footer').inert = true;
    document.body.style.overflow = 'hidden';
    ovClose.focus({ preventScroll: true });
  }
  function hideOverlay() {
    if (!ov.classList.contains('show')) return;
    ov.classList.remove('show'); ovClose.classList.remove('show');
    $('#top').inert = false; $('#main').inert = false; $('#footer').inert = false;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function route() {
    var h = decodeURIComponent(location.hash.slice(1)), idx = -1;
    P.forEach(function (p, i) { if (p.slug === h) idx = i; });
    if (idx >= 0) {
      if (!scene.classList.contains('open')) setOpen(true, false);
      cur = idx; render(); showOverlay(projectHTML(P[idx], idx));
    } else if (h === 'a-propos') showOverlay(aboutHTML());
    else hideOverlay();
  }
  function closeOverlay() { history.pushState(null, '', location.pathname + location.search); route(); }
  ovClose.addEventListener('click', closeOverlay);
  ov.addEventListener('click', function (e) { if (e.target === ov) closeOverlay(); });
  window.addEventListener('hashchange', route);
  route();

  document.addEventListener('keydown', function (e) {
    if (ov.classList.contains('show')) {
      if (e.key === 'Escape') closeOverlay();
      else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && P.some(function (p) { return '#' + p.slug === location.hash; })) {
        var i = cur + (e.key === 'ArrowRight' ? 1 : -1);
        location.hash = P[(i + n) % n].slug;
      }
      return;
    }
    if (!scene.classList.contains('open')) return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'Escape') setOpen(false, true);
  });
})();
</script>
</body>
</html>
